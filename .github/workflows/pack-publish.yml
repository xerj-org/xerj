# Scheduled publish of the committed corpus packs (rust-vulns, M6 of the
# corpus-builder arc; agent-session-trajectories, the first
# external-contributor pack). A pack's freshness is whatever its last build
# fetched — that is an operational promise this workflow keeps, not a README
# claim: the pack's own 30-day staleness refusal applies to our published
# corpus exactly as it does to a user's reference corpora, so a build that
# stops here shows up as a stale badge, not a silently aging artifact.
#
# Chain of custody, in job order:
#   build (recipe.toml, committed) → sign (per-pack PACK_SIGNING_SEED* secret)
#   → verify against the COMMITTED public key → publish
# The verify step is load-bearing: it proves the secret still matches
# tools/packs/keys/rust-vulns.pub in the same run that publishes, so a
# rotated key that forgot to update the .pub fails HERE instead of shipping
# a pack no consumer can verify.
#
# Manual runs welcome: workflow_dispatch built the first release and rebuilds
# after a recipe change without waiting for the cron tick.

name: pack publish

on:
  schedule:
    # daily at 04:23 UTC — off the :00/:30 marks; a vuln pack does not need
    # minute-level freshness (sources update daily at best)
    - cron: "23 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # release assets

# Never two publishes at once: the release tag is rolling, and clobbering
# uploads from concurrent runs would interleave artifacts from two builds.
concurrency:
  group: pack-publish
  cancel-in-progress: false

jobs:
  rust-vulns:
    name: build + sign + publish rust-vulns
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine

      # Same profile the toolkit jobs use: opt-level 3, assertions on. The
      # binary only builds a pack here, and ci-test binaries land in
      # target/ci-test/ (see the XERJ_BIN note in ci.yml — do not point
      # anything at target/release/, which this job never builds).
      - name: Build the xerj binary
        working-directory: engine
        run: cargo build --profile ci-test -p xerj-server

      # Build state under the workspace, not /tmp: the same rule the skill
      # teaches users. The path is fixed by the build command below:
      # $XERJ_CODE_HOME/builds/<name>/pack/<name>/
      - name: Build the pack
        env:
          XERJ_CODE_HOME: ${{ github.workspace }}/.pack-home
        run: |
          engine/target/ci-test/xerj corpus build rust-vulns \
            --recipe tools/packs/rust-vulns/recipe.toml

      - name: Sign the pack
        env:
          XERJ_CODE_HOME: ${{ github.workspace }}/.pack-home
          PACK_SIGNING_SEED: ${{ secrets.PACK_SIGNING_SEED }}
        run: |
          if [ -z "$PACK_SIGNING_SEED" ]; then
            echo "PACK_SIGNING_SEED secret is not set. Generate a keypair:"
            echo "  xerj corpus keygen --out tools/packs/keys/rust-vulns"
            echo "commit the .pub, set the secret to the .key's hex line, delete the .key"
            exit 1
          fi
          printf '%s' "$PACK_SIGNING_SEED" > "$RUNNER_TEMP/pack.key"
          engine/target/ci-test/xerj corpus sign \
            "$XERJ_CODE_HOME/builds/rust-vulns/pack/rust-vulns" \
            --key "$RUNNER_TEMP/pack.key"
          rm -f "$RUNNER_TEMP/pack.key"

      # Prove the published artifact installs AND that the secret matches the
      # committed .pub — the consumer's exact command, against the key file
      # exactly as a consumer would fetch it from this repo.
      - name: Verify + install the signed pack (consumer path)
        env:
          XERJ_CODE_HOME: ${{ github.workspace }}/.pack-home-verify
        run: |
          engine/target/ci-test/xerj corpus add rust-vulns \
            --from "$GITHUB_WORKSPACE/.pack-home/builds/rust-vulns/pack/rust-vulns" \
            --verify-sig tools/packs/keys/rust-vulns.pub

      - name: Pack release metadata (freshness.json)
        env:
          XERJ_CODE_HOME: ${{ github.workspace }}/.pack-home
        run: |
          cd "$XERJ_CODE_HOME/builds/rust-vulns/pack/rust-vulns"
          RECORDS=$(python3 -c "import json;print(json.load(open('manifest.json'))['counts']['records'])")
          BUILT=$(python3 -c "import json;print(json.load(open('manifest.json'))['created_at'])")
          GEN=$(python3 -c "import json;print(json.load(open('manifest.json'))['generation'])")
          cat > "$RUNNER_TEMP/rust-vulns-freshness.json" <<EOF
          {
            "schemaVersion": 1,
            "label": "rust-vulns pack",
            "message": "$RECORDS advisories, built ${BUILT%%T*}, gen $GEN",
            "color": "blue"
          }
          EOF

      - name: Zip the pack
        env:
          XERJ_CODE_HOME: ${{ github.workspace }}/.pack-home
        run: |
          cd "$XERJ_CODE_HOME/builds/rust-vulns/pack/rust-vulns"
          zip -qr "$RUNNER_TEMP/rust-vulns-pack.zip" .
          # the checksums and signature also ship as loose assets, so a
          # consumer can audit a download without unpacking the zip first
          cp SHA256SUMS "$RUNNER_TEMP/rust-vulns-SHA256SUMS"
          cp SHA256SUMS.sig "$RUNNER_TEMP/rust-vulns-SHA256SUMS.sig"

      # This repository has immutable releases, which make release tags
      # SINGLE-USE: a tag that has named an immutable release can never name
      # another — not even after the release is DELETED. Run 36358399114 hit
      # "Cannot create ref … / tag_name was used by an immutable release"
      # reusing a deleted tag, and run 37826006767 hit the same wall through
      # the old "drop today's release and recreate it" re-run path: the
      # delete SUCCEEDS, the recreate cannot. So:
      #   1. pick the first tag nobody has used — the bare date, else -r2,
      #      -r3, … (a published release or an existing ref is visible to
      #      the picker; a tag burned by a deleted release is not, so the
      #      publish step below retags past a refusal instead of failing),
      #   2. create it as a DRAFT and upload the assets to the draft,
      #   3. publish the draft (`release.published` fires).
      # Published releases are never deleted here; the signature over
      # SHA256SUMS pins the bytes that shipped. A best-effort retention
      # step keeps only the newest 7 (drafts included).
      - name: Pick an unused release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="pack-rust-vulns-$(date -u +%F)"
          TAG="$BASE"; N=1
          while gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; do
            N=$((N + 1)); TAG="$BASE-r$N"
          done
          echo "PACK_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload the assets to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PACK_TAG }}
          name: "rust-vulns corpus pack (${{ env.PACK_TAG }})"
          draft: true
          prerelease: true
          body: |
            The `rust-vulns` corpus pack, built and signed by the scheduled
            `pack publish` workflow from `tools/packs/rust-vulns/recipe.toml`.

            One release per build; under immutable releases a same-day
            rebuild publishes under `-r2`, `-r3`, … instead of replacing
            the day's earlier release. The newest is always at
            https://github.com/xerj-org/xerj/releases?q=pack-rust-vulns
            Build history lives in the releases themselves and in the
            workflow runs.

            Install (public key: `tools/packs/keys/rust-vulns.pub` in the repo):

                xerj corpus add rust-vulns --from rust-vulns-pack.zip \
                  --verify-sig rust-vulns.pub
                xerj corpus index rust-vulns

            `rust-vulns-freshness.json` carries the build date and record
            count; the same 30-day staleness refusal that governs every
            reference corpus governs this one.
          files: |
            ${{ runner.temp }}/rust-vulns-pack.zip
            ${{ runner.temp }}/rust-vulns-SHA256SUMS
            ${{ runner.temp }}/rust-vulns-SHA256SUMS.sig
            ${{ runner.temp }}/rust-vulns-freshness.json

      # Draft first, publish last: this is the step GitHub's own error
      # message prescribes for immutable-release repositories. A tag whose
      # release was DELETED is burned with no queryable trace, so the
      # picker cannot foresee the refusal — on "tag_name was used by an
      # immutable release" we retag this draft to the next free -rN and
      # publish that instead of failing the run (verified by hand on the
      # 2026-10-08 rust-vulns repair).
      - name: Publish the draft (retag past a burned tag if refused)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release edit "$PACK_TAG" --repo "$GITHUB_REPOSITORY" --draft=false; then
            exit 0
          fi
          RELID=$(gh api 'repos/$GITHUB_REPOSITORY/releases?per_page=100' --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$PACK_TAG\") | .id" | head -1)
          if [ -z "$RELID" ]; then
            echo "publish refused and no draft named $PACK_TAG found" >&2
            exit 1
          fi
          N=1; NEW="$PACK_TAG"
          while gh release view "$NEW" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$NEW" >/dev/null 2>&1; do
            N=$((N + 1)); NEW="$PACK_TAG-r$N"
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELID" \
            -f tag_name="$NEW" -F draft=false

      # Immutable releases allow deletion (verified by hand). Sort by
      # created_at, not by tag: a same-day "-r2" suffix would break
      # lexicographic date order. Drafts are included — an abandoned draft
      # holds its tag forever under the picker above. Best effort only; a
      # retention failure must never cost the publish.
      - name: Retire pack releases beyond the newest 7
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t old < <(gh api 'repos/$GITHUB_REPOSITORY/releases?per_page=100' \
            --paginate \
            --jq '[.[] | select(.tag_name | startswith("pack-rust-vulns-"))]
                  | sort_by(.created_at) | reverse | .[7:] | .[].tag_name')
          for tag in "${old[@]:-}"; do
            [ -n "$tag" ] && gh release delete "$tag" \
              --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

  agent-session-trajectories:
    name: build + sign + publish agent-session-trajectories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine

      - name: Build the xerj binary
        working-directory: engine
        run: cargo build --profile ci-test -p xerj-server

      - name: Build the pack
        env:
          XERJ_CODE_HOME: ${{ github.workspace }}/.pack-home
        run: |
          engine/target/ci-test/xerj corpus build agent-session-trajectories \
            --recipe tools/packs/agent-session-trajectories/recipe.toml

      - name: Sign the pack
        env:
          XERJ_CODE_HOME: ${{ github.workspace }}/.pack-home
          PACK_SIGNING_SEED_AST: ${{ secrets.PACK_SIGNING_SEED_AST }}
        run: |
          if [ -z "$PACK_SIGNING_SEED_AST" ]; then
            echo "PACK_SIGNING_SEED_AST secret is not set. Generate a keypair:"
            echo "  xerj corpus keygen --out tools/packs/keys/agent-session-trajectories"
            echo "commit the .pub, set the secret to the .key's hex line, delete the .key"
            exit 1
          fi
          printf '%s' "$PACK_SIGNING_SEED_AST" > "$RUNNER_TEMP/pack.key"
          engine/target/ci-test/xerj corpus sign \
            "$XERJ_CODE_HOME/builds/agent-session-trajectories/pack/agent-session-trajectories" \
            --key "$RUNNER_TEMP/pack.key"
          rm -f "$RUNNER_TEMP/pack.key"

      - name: Verify + install the signed pack (consumer path)
        env:
          XERJ_CODE_HOME: ${{ github.workspace }}/.pack-home-verify
        run: |
          engine/target/ci-test/xerj corpus add agent-session-trajectories \
            --from "$GITHUB_WORKSPACE/.pack-home/builds/agent-session-trajectories/pack/agent-session-trajectories" \
            --verify-sig tools/packs/keys/agent-session-trajectories.pub

      - name: Pack release metadata (freshness.json)
        env:
          XERJ_CODE_HOME: ${{ github.workspace }}/.pack-home
        run: |
          cd "$XERJ_CODE_HOME/builds/agent-session-trajectories/pack/agent-session-trajectories"
          RECORDS=$(python3 -c "import json;print(json.load(open('manifest.json'))['counts']['records'])")
          BUILT=$(python3 -c "import json;print(json.load(open('manifest.json'))['created_at'])")
          GEN=$(python3 -c "import json;print(json.load(open('manifest.json'))['generation'])")
          cat > "$RUNNER_TEMP/agent-session-trajectories-freshness.json" <<EOF
          {
            "schemaVersion": 1,
            "label": "agent-session-trajectories pack",
            "message": "$RECORDS trajectories, built ${BUILT%%T*}, gen $GEN",
            "color": "blue"
          }
          EOF

      - name: Zip the pack
        env:
          XERJ_CODE_HOME: ${{ github.workspace }}/.pack-home
        run: |
          cd "$XERJ_CODE_HOME/builds/agent-session-trajectories/pack/agent-session-trajectories"
          zip -qr "$RUNNER_TEMP/agent-session-trajectories-pack.zip" .
          # the checksums and signature also ship as loose assets, so a
          # consumer can audit a download without unpacking the zip first
          cp SHA256SUMS "$RUNNER_TEMP/agent-session-trajectories-SHA256SUMS"
          cp SHA256SUMS.sig "$RUNNER_TEMP/agent-session-trajectories-SHA256SUMS.sig"

      # Same immutable-release protocol as the rust-vulns job above: pick
      # the first unused tag (date, then -r2, -r3, …), upload to a draft,
      # publish last, never delete a published release for a rebuild.
      - name: Pick an unused release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="pack-agent-session-trajectories-$(date -u +%F)"
          TAG="$BASE"; N=1
          while gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; do
            N=$((N + 1)); TAG="$BASE-r$N"
          done
          echo "PACK_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload the assets to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PACK_TAG }}
          name: "agent-session-trajectories corpus pack (${{ env.PACK_TAG }})"
          draft: true
          prerelease: true
          body: |
            The `agent-session-trajectories` corpus pack — the first
            external-contributor pack on the hub (chunxiaoxx / Nautilus,
            #1255; demand anchored to #1138, wishlist slot #1210). 70
            sanitized multi-session agent trajectories with failure turns
            kept verbatim, built and signed by the `pack publish` workflow
            from `tools/packs/agent-session-trajectories/recipe.toml`.

            One release per build; under immutable releases a same-day
            rebuild publishes under `-r2`, `-r3`, … instead of replacing
            the day's earlier release. The newest is always at
            https://github.com/xerj-org/xerj/releases?q=pack-agent-session-trajectories

            Install (public key: `tools/packs/keys/agent-session-trajectories.pub` in the repo):

                xerj corpus add agent-session-trajectories \
                  --from agent-session-trajectories-pack.zip \
                  --verify-sig agent-session-trajectories.pub
                xerj corpus index agent-session-trajectories

            `agent-session-trajectories-freshness.json` carries the build
            date and record count; the same 30-day staleness refusal that
            governs every reference corpus governs this one.
          files: |
            ${{ runner.temp }}/agent-session-trajectories-pack.zip
            ${{ runner.temp }}/agent-session-trajectories-SHA256SUMS
            ${{ runner.temp }}/agent-session-trajectories-SHA256SUMS.sig
            ${{ runner.temp }}/agent-session-trajectories-freshness.json

      # Draft first, publish last: this is the step GitHub's own error
      # message prescribes for immutable-release repositories. A tag whose
      # release was DELETED is burned with no queryable trace, so the
      # picker cannot foresee the refusal — on "tag_name was used by an
      # immutable release" we retag this draft to the next free -rN and
      # publish that instead of failing the run (verified by hand on the
      # 2026-10-08 rust-vulns repair).
      - name: Publish the draft (retag past a burned tag if refused)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release edit "$PACK_TAG" --repo "$GITHUB_REPOSITORY" --draft=false; then
            exit 0
          fi
          RELID=$(gh api 'repos/$GITHUB_REPOSITORY/releases?per_page=100' --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$PACK_TAG\") | .id" | head -1)
          if [ -z "$RELID" ]; then
            echo "publish refused and no draft named $PACK_TAG found" >&2
            exit 1
          fi
          N=1; NEW="$PACK_TAG"
          while gh release view "$NEW" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$NEW" >/dev/null 2>&1; do
            N=$((N + 1)); NEW="$PACK_TAG-r$N"
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELID" \
            -f tag_name="$NEW" -F draft=false

      # Immutable releases allow deletion (verified by hand). Sort by
      # created_at, not by tag: a same-day "-r2" suffix would break
      # lexicographic date order. Drafts are included — an abandoned draft
      # holds its tag forever under the picker above. Best effort only; a
      # retention failure must never cost the publish.
      - name: Retire pack releases beyond the newest 7
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t old < <(gh api 'repos/$GITHUB_REPOSITORY/releases?per_page=100' \
            --paginate \
            --jq '[.[] | select(.tag_name | startswith("pack-agent-session-trajectories-"))]
                  | sort_by(.created_at) | reverse | .[7:] | .[].tag_name')
          for tag in "${old[@]:-}"; do
            [ -n "$tag" ] && gh release delete "$tag" \
              --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
