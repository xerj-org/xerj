name: Deploy site (Cloudflare Pages)

# Deploys the static site under landing/ to the "xerj" Cloudflare Pages project
# on every push to main. Cloudflare serves landing/ verbatim; the only build
# step is `gen_sitemap.py --write`, which writes sitemap.xml into landing/ just
# before the upload because that file is not kept in git. Auth is a scoped API
# token stored as the CLOUDFLARE_API_TOKEN repo secret (needs the "Cloudflare
# Pages:Edit" permission) plus CLOUDFLARE_ACCOUNT_ID. Both are configured in
# repo Settings → Secrets.
#
# This replaces reliance on Cloudflare's git integration with an explicit,
# auditable deploy that only fires after CI/SEO gates on main have the chance to
# run, and whose logs live in Actions.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'wrangler.toml'
      # sitemap.xml is generated here, and its <lastmod> comes from
      # urlmap.article_data/pagedata dates, so any change under scripts/seo/
      # can change the shipped artifact with no landing/ edit.
      - 'scripts/seo/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}          # allow manual redeploy from the Actions tab

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false      # never abort a deploy mid-upload

jobs:
  deploy:
    name: Publish landing/ to Cloudflare Pages
    runs-on: ubuntu-latest
    # `pages-deploy` is a single non-cancelling slot shared by every deploy,
    # so an upload that wedges blocks ALL later site deploys for as long as
    # it runs. Measured max 0.7 min; 20 is generous for a network upload and
    # turns a 6-hour block into a 20-minute one.
    timeout-minutes: 20
    environment:
      name: production
      url: https://xerj.org
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          # sitemap.xml is generated below from `urlmap.DateSource`, which
          # dates a page from its content (front matter, JSON-LD, a
          # chrome-stripped git commit). A shallow clone has none of that
          # history, so undated URLs would ship the filesystem mtime — the one
          # value Google only honours when it is verifiably accurate.
          fetch-depth: 0

      - name: Guard — secrets must be present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in repo secrets."
            exit 1
          fi
          [ -d landing ] || { echo "::error::landing/ not found — nothing to deploy."; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # sitemap.xml is a deploy artifact, not a committed file, so there is
      # nothing here to forget to regenerate: it is written into landing/ just
      # before the upload and ships with the rest of the site.
      - name: Generate the sitemap
        run: python3 scripts/seo/gen_sitemap.py --write

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Upload landing/ verbatim to the existing "xerj" project, tagged with
          # the commit so a bad deploy is one rollback away in the CF dashboard.
          command: >-
            pages deploy landing
            --project-name=xerj
            --branch=main
            --commit-dirty=true
