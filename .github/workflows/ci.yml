name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default for an OSS repo; jobs opt into more if needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  cla-config:
    name: CLA gate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cla-bot reads .contributors straight off this repo; malformed JSON or a
      # missing bot exemption breaks the gate silently (it just flags everyone).
      # Regression test for the dependabot[bot] exemption (PR #194 comment).
      - name: Validate .contributors (valid JSON, bot exemptions present)
        run: |
          jq -e 'type == "array" and all(.[]; type == "string")' .contributors
          jq -e 'index("dependabot[bot]") != null' .contributors

  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            engine/target
          key: ci-lint-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ci-lint-cargo-

      - name: rustfmt (check)
        working-directory: engine
        run: cargo fmt --all --check

      - name: clippy (deny warnings)
        working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            engine/target
          key: ci-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ci-cargo-

      - name: Build (release)
        working-directory: engine
        run: cargo build --release --workspace

      - name: Unit + integration tests
        working-directory: engine
        run: cargo test --release --workspace -- --test-threads=2

  onnx-feature:
    name: ONNX feature compile + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            engine/target
          key: ci-onnx-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ci-onnx-cargo-

      - name: Compile the server ONNX feature path
        working-directory: engine
        run: cargo check -p xerj-server --no-default-features --features onnx-experimental

      - name: Test the ONNX embedder
        working-directory: engine
        run: cargo test -p xerj-ai --features onnx-experimental --lib -- --test-threads=2

      - name: Test engine embedding identity with ONNX
        working-directory: engine
        run: cargo test -p xerj-engine --features onnx-experimental --lib index::embedding_identity_tests -- --test-threads=2

      - name: Clippy the ONNX implementation
        working-directory: engine
        run: cargo clippy -p xerj-ai -p xerj-engine --all-targets --features onnx-experimental -- -D warnings

  api-checks:
    name: API smoke + liveness + benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            engine/target
          key: ci-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ci-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build xerj (release)
        working-directory: engine
        run: cargo build --release -p xerj-server

      # Boots the binary, seeds a real corpus, then gates on:
      #   smoke suite (61/61), API liveness (no 5xx across the read surface),
      #   and prints the hot-path benchmark. Deterministic — no model needed.
      - name: API smoke + liveness + benchmark
        run: bash demo/playbooks/ci-check.sh

  conformance:
    name: ES-compat YAML conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            engine/target
          key: ci-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ci-cargo-

      - name: Build server + conformance runner (release)
        working-directory: engine
        run: cargo build --release -p xerj-server -p es-yaml-runner

      # rc.3 regression: the shipped xerj.default.toml failed to parse
      # (`unknown field hnsw_offload_threshold`) so the documented
      # `--config` invocation was a dead boot. Boot the real binary with
      # the real shipped file and require it to answer HTTP before the
      # conformance server takes port 9200. Runs from a temp dir because
      # the shipped config uses a relative `data_dir = "./data"`, and
      # accepts any HTTP status (auth is enabled in the shipped config,
      # so an unauthenticated probe legitimately gets 401).
      - name: Shipped default config boots (rc.3 regression)
        run: |
          set -euo pipefail
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          "$GITHUB_WORKSPACE/engine/target/release/xerj" \
            --config "$GITHUB_WORKSPACE/engine/xerj.default.toml" > server.log 2>&1 &
          SMOKE_PID=$!
          up=""
          for _ in $(seq 1 80); do
            code="$(curl -s -m1 -o /dev/null -w '%{http_code}' localhost:9200/ || true)"
            if [ "$code" != "000" ] && [ -n "$code" ]; then up="$code"; break; fi
            if ! kill -0 "$SMOKE_PID" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [ -z "$up" ]; then
            echo "xerj failed to boot with the shipped xerj.default.toml"
            cat server.log
            exit 1
          fi
          echo "shipped-config boot OK (HTTP $up)"
          kill "$SMOKE_PID" 2>/dev/null || true
          wait "$SMOKE_PID" 2>/dev/null || true

      - name: Boot xerj
        working-directory: engine
        run: |
          set -euo pipefail
          DATA="$(mktemp -d)"
          echo "XERJ_DATA=$DATA" >> "$GITHUB_ENV"
          ./target/release/xerj --insecure --data-dir "$DATA" > "$DATA/server.log" 2>&1 &
          echo "XERJ_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 80); do
            if curl -fs -m1 localhost:9200/_cluster/health >/dev/null 2>&1; then
              echo "xerj is up"; exit 0
            fi
            sleep 0.25
          done
          echo "xerj failed to become healthy"; cat "$DATA/server.log"; exit 1

      # The runner exits non-zero if any case fails. Skipped cases do not count
      # as failures, so the gate is 0 failures — not an exact pass total, which
      # grows as cases are added (1365 passed / 3 skipped at the last measured
      # run, per #189; this comment previously said 1326 and had drifted).
      - name: Run ES-compat YAML suite (0 failures required)
        working-directory: engine
        run: cargo run --release -p es-yaml-runner -- --dir tests/es-compat-yaml/yaml

      - name: Server log on failure
        if: failure()
        run: cat "$XERJ_DATA/server.log" || true

      - name: Stop xerj
        if: always()
        run: kill "${XERJ_PID:-}" 2>/dev/null || true

  # THE MAP's clustering pipeline is pure, dependency-free JS, so its two
  # load-bearing claims — "≤ 13 groups at any scale" and "byte-identical
  # across runs" — are checkable offline in a few hundred milliseconds. Until
  # this job existed the whole pipeline was covered only by a manual Puppeteer
  # script that needs a live server and a real browser, i.e. by nothing.
  ux-tests:
    name: UX pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: THE MAP pipeline contract
        run: node --test xerj-ux/test/*.test.mjs

  # The harnesses under demo/usecases/ are the only executable proof that the
  # shipped use cases still work — the brain HTTP surface, the MCP tool surface
  # an agent actually sees, and autoindex's zero-config discovery. Every one of
  # them was manual until this job, so a regression in any was caught by
  # nothing. The installer lint rides along: landing/get{,.ps1} had no
  # verification of any kind and needs no toolchain, so it gates first and
  # cheaply. The /get counter test rides along for the same reason — it is the
  # only gate on the promise that the install counter stores no IP and never
  # breaks an install, and it needs nothing but Node.
  usecase-smoke:
    name: Use-case harnesses (brain + MCP + autoindex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer script lint (landing/get, landing/get.ps1)
        run: bash .github/scripts/installer-lint.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install counter behaviour + privacy (functions/get.js)
        run: node .github/scripts/functions-get-test.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            engine/target
          key: ci-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ci-cargo-

      - name: Build xerj + xerj-mcp (release)
        working-directory: engine
        run: cargo build --release -p xerj-server -p xerj-mcp

      # Drives the demo/usecases scripts themselves, so the thing CI gates is
      # the same thing a reader runs. No browser, no model, no network.
      - name: Use-case smoke (brain transcript, MCP tools, autoindex discovery)
        run: bash .github/scripts/usecase-smoke.sh

  # Per-OS runtime gate. The earlier autoindex "Too many open files" crash was
  # macOS-only and slipped through because nothing in CI actually RAN the binary
  # on macOS/Windows. This job boots xerj and autoindexes a many-dataset corpus
  # on each OS under a constrained descriptor budget, failing on any EMFILE.
  # macOS runners default to `ulimit -n 256` — the exact condition it regressed
  # under.
  autoindex-fd-smoke:
    name: Autoindex FD smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            engine/target
          key: ci-smoke-${{ matrix.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ci-smoke-${{ matrix.os }}-

      - name: Build xerj (release)
        working-directory: engine
        run: cargo build --release -p xerj-server

      - name: Autoindex a many-dataset corpus (must not exhaust file descriptors)
        shell: bash
        run: bash .github/scripts/autoindex-fd-smoke.sh
