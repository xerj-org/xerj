name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default for an OSS repo; jobs opt into more if needed.
permissions:
  contents: read

# Cancel superseded runs on a PR branch (rapid pushes), but NEVER on `main`:
# every commit that lands on the default branch must run CI to completion, or a
# later merge cancels the earlier merge's run and the branch's status badge shows
# that cancellation as "failing" even though nothing broke.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

# #456: every `uses:` below is pinned to a commit SHA (with the resolved
# tag/version as a trailing comment for humans), including `dtolnay/rust-
# toolchain`, whose git ref IS the rustc version it installs. Before this,
# `@stable` meant "whatever rustup resolves as stable on the day the job
# runs" -- the compiler CI validates against could move with no commit, no
# review, and nothing in the diff. Bumping any of these now takes an actual
# PR, the same as bumping a Cargo dependency. `dtolnay/rust-toolchain@nightly`
# (the fuzz job) is the one exception left floating: nightly drifting is the
# point there, so only its ACTION ref is pinned, not what "nightly" resolves
# to on the day the job runs.
jobs:
  cla-config:
    name: CLA gate config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # cla-bot reads .contributors straight off this repo; malformed JSON or a
      # missing bot exemption breaks the gate silently (it just flags everyone).
      # Regression test for the dependabot[bot] exemption (PR #194 comment).
      - name: Validate .contributors (valid JSON, bot exemptions present)
        run: |
          jq -e 'type == "array" and all(.[]; type == "string")' .contributors
          jq -e 'index("dependabot[bot]") != null' .contributors

      # cla-bot matches commit AUTHORS only, so a maintainer re-land whose
      # commits carry the fork contributor's Co-authored-by trailer goes green
      # without that contributor ever signing (issue #269; live instance
      # PR #248 re-landing #166). Check the trailers too.
      - name: Co-author CLA check unit tests
        run: python3 scripts/test_cla_coauthors.py

      # The narrow field-report carve-out lives here: pass the PR's changed
      # files to the checker, which SKIPS the trailer gate iff every changed
      # path is a markdown field report under user-feedback/16-agent-field-reports/
      # (and nothing else). Any code/CI/other-docs change re-arms the full gate.
      # The binding `verification/cla-signed` status for a field-report-only PR
      # is provided separately (.github/workflows/cla-field-report-exempt.yml),
      # because cla-bot cannot path-scope itself.
      - name: Co-authored-by trailers resolve to signed contributors
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          FILES="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
          python3 scripts/check_cla_coauthors.py --pr "$PR_NUMBER" --changed-files "$FILES"

  reference-coding:
    name: Reference-coding toolkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Shell syntax
        run: |
          for f in tools/xerj-code/scripts/*.sh tools/xerj-code/tests/*.sh; do
            bash -n "$f"
          done
          python3 -m py_compile tools/xerj-code/scripts/xc.py \
                                tools/xerj-code/tests/validate_manifest.py

      # The corpus manifests are the shareable artifact (issue #319): if they
      # cannot rebuild a corpus, publishing them is worse than not shipping
      # them. Offline — the fixtures are local git repos served over file://.
      - name: Corpus manifest round-trip
        run: tools/xerj-code/tests/test_xc_corpus.sh

      - name: Vetted hub manifests validate
        run: python3 tools/xerj-code/tests/validate_manifest.py --hub tools/xerj-code/hub/*.json

  # #489: this script existed, worked, and had been failing locally for three
  # releases — the version footer, headline and narrative on landing/index.html
  # stayed pinned to rc.15 through rc.16 and rc.17 because nothing ran it. It is
  # fast, needs no toolchain, and only touches static HTML/text, so it belongs
  # beside the other docs/tooling gates rather than in the release job —
  # catching drift at PR time is the point, not after the site has been stale
  # for weeks. fetch-depth: 0 is required (not the default fetch-depth: 1):
  # the guard resolves "the newest released tag" via `git tag --list`, which a
  # shallow checkout does not fetch.
  landing-constants-guard:
    name: Landing constants guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Landing page constants agree with the newest release
        run: bash .github/scripts/landing-constants-guard.sh

  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine

      - name: rustfmt (check)
        working-directory: engine
        run: cargo fmt --all --check

      - name: clippy (deny warnings)
        working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings

  # #352: #327 (tree-sitter 0.25) and #317 (0.26) were each green alone, but
  # tree-sitter is a `links` crate so only one version may exist. The merged
  # tree stopped resolving, taking out build/test/clippy/release at once.
  # Each PR's checks ran on its own merge ref (head + base-at-check-time) and
  # neither base had the sibling yet; GitHub does not re-run a green PR when the
  # base moves, so the conflicting pair was never in one check's tree. This job
  # runs on refs/pull/N/merge too (default checkout on pull_request), so it does
  # NOT close that stale-base gap by itself. Its value is a fast dedicated signal
  # (seconds, no compile) plus `--locked`, which catches Cargo.lock drift no
  # other job checks. The tree-sitter recurrence is prevented structurally by the
  # hoist to [workspace.dependencies], where two version bumps now collide on one
  # line. (#749)
  workspace-resolves:
    name: Workspace resolves (links + lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: cargo metadata (resolves the merge; fails on a links conflict or lock drift)
        working-directory: engine
        run: cargo metadata --locked --format-version 1 >/dev/null

  # XERJ's security pitch is "no JVM, so none of the Log4Shell class of supply
  # chain CVEs" — which is only worth anything if somebody is actually watching
  # the 660-odd crates we do depend on. This job is that somebody. It was
  # documented as existing long before it did (#207); a claimed gate that no
  # runner executes is worse than no gate, because readers price it in.
  #
  # Failure policy: RUSTSEC *vulnerabilities* fail the build. Informational
  # warnings (unmaintained / unsound / yanked) are printed and do not, because
  # most of ours sit in transitive crates we cannot upgrade unilaterally and a
  # gate that is red for reasons nobody can act on gets ignored, then disabled.
  # They are still in the log on every run, which is the point.
  security-audit:
    name: Dependency advisory audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      # Cache the binary, not the advisory database — the database is the part
      # that must be fetched fresh on every run. Bump the `-vN` suffix to force
      # a cargo-audit upgrade (a very old binary can fail to read a newer
      # advisory-db schema).
      - name: Cache cargo-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ci-cargo-audit-bin-v1

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: engine
        run: cargo audit

  # Real fuzzing, for the same reason: `user-feedback/09-security/` promised
  # "fuzz testing (cargo-fuzz) on all input parsing paths" while the tree held
  # no fuzz target at all (#207). The harnesses live in engine/fuzz and cover
  # the parsers an unauthenticated request reaches: the ES query DSL, the
  # Lucene query_string grammar, date math and date formats, SQL, and Painless.
  #
  # On a pull request this is mostly a *regression* run — every checked-in seed
  # is replayed through every target, and the leftover budget explores. For a
  # real campaign, run the same script with a bigger budget:
  #   FUZZ_SECONDS=3600 bash .github/scripts/fuzz-smoke.sh
  fuzz:
    name: Fuzz harnesses (cargo-fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # libFuzzer + the sanitizer runtimes are nightly-only.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly (pinned action ref; toolchain itself floats by design)
        with:
          components: rustfmt

      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-fuzz
            engine/fuzz/target
          key: ci-fuzz-${{ hashFiles('engine/Cargo.lock', 'engine/fuzz/Cargo.toml') }}
          restore-keys: ci-fuzz-

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked

      # The fuzz crate is its own workspace, so the `lint` job's
      # `cargo fmt --all` never sees it. No `--all` here: it would follow the
      # path dependencies back into the engine and re-check what `lint` covers.
      - name: rustfmt the fuzz crate
        working-directory: engine
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check

      - name: Build + run every fuzz target
        run: bash .github/scripts/fuzz-smoke.sh

      # A crashing input is the entire product of this job; losing it would
      # mean the failure is unreproducible.
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: engine/fuzz/artifacts/
          if-no-files-found: ignore

  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    # #751's second-order damage is the whole job hanging against GitHub's 6h
    # default while main's `cancel-in-progress: false` never auto-cancels — main
    # then sits ~4h with no CI verdict. The step-6 `timeout-minutes: 12` below
    # bounds the one documented hang (step 6, default parallelism) precisely and
    # fast. This job-level cap is defense-in-depth: it bounds ANY hang in the job
    # (setup, cache, a future test race the step timeout would not cover) to
    # 50 min instead of the 6h default. It is deliberately generous because
    # step 5 (build + threads=2 tests) can legitimately take ~36 min on a loaded
    # 2-4 vCPU runner — a slow compile, not a hang (measured: step 5 built for
    # ~36 min then step 6 ran and passed) — so a tighter cap would false-fail
    # slow-but-healthy runs. Neither cap fixes the root race (#751 stays open for
    # the bisect + port/fixture serialisation).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine
          # Single writer for the Linux [profile.ci-test] dependency cache.
          # This job compiles the whole workspace, so its dependency set is a
          # superset of what api-checks / conformance / usecase-smoke need;
          # they restore this same key read-only. rust-cache's default key is
          # per-job, which meant five near-identical ~700 MB copies competing
          # for a 10 GB repo budget and evicting each other.
          shared-key: ci-test-linux

      # One cargo invocation, not two. `cargo build --release --workspace` used
      # to run first, but `panic = "abort"` in [profile.release] makes cargo
      # rebuild the whole dependency graph with `panic = "unwind"` for the test
      # targets, so that step handed the tests almost nothing: on run
      # 31571998506 it compiled 39 crates in 9m17s and the test step then
      # compiled 453. The fat-LTO link of every workspace member is still
      # gated -- it moved to the `release-build` job, which runs concurrently
      # instead of in front of this one.
      #
      # [profile.ci-test] keeps opt-level 3 and release's assertion settings and
      # only drops whole-program LTO / codegen-unit merging. Fat-LTO linking of
      # ~99 separate test binaries was 76m05s of this job's 78-minute test step;
      # the tests themselves ran in 1m52s.
      - name: Unit + integration tests
        working-directory: engine
        run: cargo test --profile ci-test --workspace -- --test-threads=2

      # Issue #372. `--test-threads=2` above is a deliberate configuration, and
      # it is not the one a contributor gets: plain `cargo test` runs one thread
      # per core. Two xerj-engine lib tests failed on a clean checkout at that
      # default and this workflow could not see either of them, because two
      # threads serialise enough of the suite to hide the interleaving. The
      # general rule the third such defect in one cycle earns: CI must run at
      # least one configuration that matches what a contributor actually types.
      #
      # Honest about its reach, because "default parallelism" is not a fixed
      # number: `ubuntu-latest` is a 2-4 vCPU runner, so the default here is
      # 2-4 threads -- barely above the `--test-threads=2` that hid #372, and
      # far from the 20 that surfaced it (11 of 16 clean-main runs red on a
      # 20-core box). This step would most likely NOT have caught #372 on this
      # runner. It is cheap insurance and the place a wider, better-sized gate
      # (#384) can land -- not a claim that the class is now covered.
      #
      # #384: widened progressively — `-p xerj-engine --lib` -> `--workspace --lib`
      # -> the full `--workspace` (all targets, INCLUDING the integration tests
      # under `crates/*/tests/*.rs`) — now that every scope is *measured* green at
      # default parallelism (6 clean `--workspace --lib` runs, then 4 clean full
      # `--workspace` runs, ci-test profile, 20 cores). This was blocked until
      # #385: xerj-autoindex used to be red because `incremental_reconcile_http_tests`
      # could reach the global `SNAPSHOT_FAILPOINT` without holding the
      # `SNAPSHOT_TEST_LOCK` and steal another test's injected failure; the
      # thread-local failpoint fix (merged) removed that defect. The integration
      # targets bind ports and share fixture dirs, so they are the likeliest to
      # carry this class of defect (#384's own note) — but they passed every run
      # here, and a hosted runner has FEWER cores than this 20-core box, so its
      # default parallelism is strictly lower and less contended than what these
      # runs already survived. A gate is worth nothing if it is merged red, so it
      # goes in at the width it passes at.
      #
      # Reuses the binaries the step above already built: the added cost is test
      # runtime, not another compile.
      # #751: this step intermittently hangs on the 2-4 vCPU hosted runner (a
      # port/fixture race at low thread count — normal ~2.3 min, observed hanging
      # 18-28 min). Because main's `cancel-in-progress: false` never auto-cancels,
      # a hang leaves the whole run stuck for hours with no completed signal, so
      # main commits never get a CI verdict. Bound it: a hang now fails the step
      # in 12 min (5x normal, well under the observed hangs) so the run completes
      # and `gh run rerun --failed` can recover. This does NOT fix the root race —
      # #751 stays open for the bisect + port/fixture serialisation.
      - name: Workspace tests (all targets) at default parallelism (contributor's `cargo test`)
        timeout-minutes: 12
        working-directory: engine
        run: cargo test --profile ci-test --workspace

  # Fat LTO + codegen-units=1 + panic=abort over every workspace member is a
  # failure mode of its own (LTO ICEs, symbol collisions, panic-strategy
  # mismatches) and is not covered by `cargo clippy --all-targets` in `lint`
  # nor by the `-p xerj-server` builds elsewhere -- xerj-wasm, for one, is in
  # no other job's dependency closure. So it stays gated, just not in series
  # with the tests.
  release-build:
    name: Release build (fat LTO, all members link)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine

      - name: Build (release)
        working-directory: engine
        run: cargo build --release --workspace

  onnx-feature:
    name: ONNX feature compile + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine

      - name: Compile the server ONNX feature path
        working-directory: engine
        run: cargo check -p xerj-server --no-default-features --features onnx-experimental

      - name: Test the ONNX embedder
        working-directory: engine
        run: cargo test -p xerj-ai --features onnx-experimental --lib -- --test-threads=2

      - name: Test engine embedding identity with ONNX
        working-directory: engine
        run: cargo test -p xerj-engine --features onnx-experimental --lib index::embedding_identity_tests -- --test-threads=2

      - name: Clippy the ONNX implementation
        working-directory: engine
        run: cargo clippy -p xerj-ai -p xerj-engine --all-targets --features onnx-experimental -- -D warnings

  api-checks:
    name: API smoke + liveness + benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine
          # Read-only consumer of build-test's ci-test dependency cache.
          # save-if:false is what makes sharing safe: these jobs run
          # concurrently, and a cache key is immutable once written, so if
          # they all saved it one would win and the rest would log
          # "Unable to reserve cache" -- the collision this PR set out to fix.
          shared-key: ci-test-linux
          save-if: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # ci-test, not release: this job boots the binary and checks liveness,
      # it does not measure performance. Fat LTO cost 6m21s here to run 3s of
      # checks. Same opt-level and features, only LTO scope differs.
      - name: Build xerj (ci-test profile)
        working-directory: engine
        run: cargo build --profile ci-test -p xerj-server

      # Boots the binary, seeds a real corpus, then gates on:
      #   smoke suite (61/61), API liveness (no 5xx across the read surface),
      #   and prints the hot-path benchmark. Deterministic — no model needed.
      - name: API smoke + liveness + benchmark
        env:
          XERJ_BIN: ${{ github.workspace }}/engine/target/ci-test/xerj
        run: bash demo/playbooks/ci-check.sh

  conformance:
    name: ES-compat YAML conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine
          # Read-only consumer of build-test's ci-test dependency cache.
          # save-if:false is what makes sharing safe: these jobs run
          # concurrently, and a cache key is immutable once written, so if
          # they all saved it one would win and the rest would log
          # "Unable to reserve cache" -- the collision this PR set out to fix.
          shared-key: ci-test-linux
          save-if: false

      # ci-test: conformance asserts wire behaviour, not throughput.
      - name: Build server + conformance runner (ci-test profile)
        working-directory: engine
        run: cargo build --profile ci-test -p xerj-server -p es-yaml-runner

      # rc.3 regression: the shipped xerj.default.toml failed to parse
      # (`unknown field hnsw_offload_threshold`) so the documented
      # `--config` invocation was a dead boot. Boot the real binary with
      # the real shipped file and require it to answer HTTP before the
      # conformance server takes port 9200. Runs from a temp dir because
      # the shipped config uses a relative `data_dir = "./data"`, and
      # accepts any HTTP status (auth is enabled in the shipped config,
      # so an unauthenticated probe legitimately gets 401).
      - name: Shipped default config boots (rc.3 regression)
        run: |
          set -euo pipefail
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          "$GITHUB_WORKSPACE/engine/target/ci-test/xerj" \
            --config "$GITHUB_WORKSPACE/engine/xerj.default.toml" > server.log 2>&1 &
          SMOKE_PID=$!
          up=""
          for _ in $(seq 1 80); do
            code="$(curl -s -m1 -o /dev/null -w '%{http_code}' localhost:9200/ || true)"
            if [ "$code" != "000" ] && [ -n "$code" ]; then up="$code"; break; fi
            if ! kill -0 "$SMOKE_PID" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [ -z "$up" ]; then
            echo "xerj failed to boot with the shipped xerj.default.toml"
            cat server.log
            exit 1
          fi
          echo "shipped-config boot OK (HTTP $up)"
          kill "$SMOKE_PID" 2>/dev/null || true
          wait "$SMOKE_PID" 2>/dev/null || true

      - name: Boot xerj
        working-directory: engine
        run: |
          set -euo pipefail
          DATA="$(mktemp -d)"
          echo "XERJ_DATA=$DATA" >> "$GITHUB_ENV"
          ./target/ci-test/xerj --insecure --data-dir "$DATA" > "$DATA/server.log" 2>&1 &
          echo "XERJ_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 80); do
            if curl -fs -m1 localhost:9200/_cluster/health >/dev/null 2>&1; then
              echo "xerj is up"; exit 0
            fi
            sleep 0.25
          done
          echo "xerj failed to become healthy"; cat "$DATA/server.log"; exit 1

      # The runner exits non-zero if any case fails. Skipped cases do not count
      # as failures, so the gate is 0 failures — not an exact pass total, which
      # grows as cases are added (1365 passed / 3 skipped at the last measured
      # run, per #189; this comment previously said 1326 and had drifted).
      - name: Run ES-compat YAML suite (0 failures required)
        working-directory: engine
        run: cargo run --release -p es-yaml-runner -- --dir tests/es-compat-yaml/yaml

      - name: Server log on failure
        if: failure()
        run: cat "$XERJ_DATA/server.log" || true

      - name: Stop xerj
        if: always()
        run: kill "${XERJ_PID:-}" 2>/dev/null || true

  # THE MAP's clustering pipeline is pure, dependency-free JS, so its two
  # load-bearing claims — "≤ 13 groups at any scale" and "byte-identical
  # across runs" — are checkable offline in a few hundred milliseconds. Until
  # this job existed the whole pipeline was covered only by a manual Puppeteer
  # script that needs a live server and a real browser, i.e. by nothing.
  ux-tests:
    name: UX pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: THE MAP pipeline contract
        run: node --test xerj-ux/test/*.test.mjs

  # The harnesses under demo/usecases/ are the only executable proof that the
  # shipped use cases still work — the brain HTTP surface, the MCP tool surface
  # an agent actually sees, and autoindex's zero-config discovery. Every one of
  # them was manual until this job, so a regression in any was caught by
  # nothing. The installer lint rides along: landing/get{,.ps1} had no
  # verification of any kind and needs no toolchain, so it gates first and
  # cheaply. The /get counter test rides along for the same reason — it is the
  # only gate on the promise that the install counter stores no IP and never
  # breaks an install, and it needs nothing but Node.
  usecase-smoke:
    name: Use-case harnesses (brain + MCP + autoindex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer script lint (landing/get, landing/get.ps1)
        run: bash .github/scripts/installer-lint.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install counter behaviour + privacy (functions/get.js)
        run: node .github/scripts/functions-get-test.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine
          # Read-only consumer of build-test's ci-test dependency cache.
          # save-if:false is what makes sharing safe: these jobs run
          # concurrently, and a cache key is immutable once written, so if
          # they all saved it one would win and the rest would log
          # "Unable to reserve cache" -- the collision this PR set out to fix.
          shared-key: ci-test-linux
          save-if: false

      - name: Build xerj + xerj-mcp (release)
        working-directory: engine
        run: cargo build --profile ci-test -p xerj-server -p xerj-mcp

      # Drives the demo/usecases scripts themselves, so the thing CI gates is
      # the same thing a reader runs. No browser, no model, no network.
      - name: Use-case smoke (brain transcript, MCP tools, autoindex discovery)
        env:
          XERJ_BIN: ${{ github.workspace }}/engine/target/ci-test/xerj
          XERJ_MCP_BIN: ${{ github.workspace }}/engine/target/ci-test/xerj-mcp
        run: bash .github/scripts/usecase-smoke.sh

      # The published agent-facing schema vs what the server actually serves.
      # It drifted once already — six tools published against ten served, every
      # xerj_brain_* tool missing — and nothing failed, because nothing
      # compared them. This drives `xerj mcp` (the subcommand a user who ran
      # the installer has, not a dev-only binary), issues a real tools/list
      # over stdio, and diffs the response against
      # landing/docs/agents/schemas/mcp-tools.json. Needs no running node:
      # tools/list is answered before any proxying.
      # XERJ_BIN must be set explicitly: this job builds with --profile ci-test
      # (#331), so the binary lands in target/ci-test/, while the script's
      # default is target/release/. Without this the gate looks for a binary CI
      # never built. Each PR was green alone; the interaction only appears once
      # both are on main.
      - name: MCP published-schema drift gate (xerj mcp ↔ mcp-tools.json)
        env:
          XERJ_BIN: ${{ github.workspace }}/engine/target/ci-test/xerj
        run: bash scripts/mcp-schema-check.sh

  # Per-OS runtime gate. The earlier autoindex "Too many open files" crash was
  # macOS-only and slipped through because nothing in CI actually RAN the binary
  # on macOS/Windows. This job boots xerj and autoindexes a many-dataset corpus
  # on each OS under a constrained descriptor budget, failing on any EMFILE.
  # macOS runners default to `ulimit -n 256` — the exact condition it regressed
  # under.
  autoindex-fd-smoke:
    name: Autoindex FD smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine

      # ci-test, not release: this job boots the binary and checks liveness,
      # it does not measure performance. Fat LTO cost 6m21s here to run 3s of
      # checks. Same opt-level and features, only LTO scope differs.
      - name: Build xerj (ci-test profile)
        working-directory: engine
        run: cargo build --profile ci-test -p xerj-server

      - name: Autoindex a many-dataset corpus (must not exhaust file descriptors)
        shell: bash
        env:
          XERJ_BIN: engine/target/ci-test/xerj
        run: bash .github/scripts/autoindex-fd-smoke.sh
