# Integration tests for smoke testing multi-node IT
# If the local machine which is running the test is low on disk space
# We can have one unassigned shard
#
# XERJ note (2026-10-06): skipped with a reason. This case used to "pass"
# because /_cluster/health echoed the requested wait_for_nodes count back as
# number_of_nodes — a fabricated topology on a single node (issue #1169).
# Health now reports real configured membership and times out an unsatisfiable
# wait_for_nodes, so this case can only pass against a genuine 2-node runner,
# which the conformance harness does not boot. Un-skip when the Raft ring is
# wired to the REST layer (#1170) and the runner can start a real cluster.
---
"cluster health basic test, wait for both nodes to join":
  - skip:
      version: "all"
      reason: "requires a genuine 2-node cluster; XERJ reports real membership now (xerj-org/xerj#1169)"
  - do:
      cluster.health:
        wait_for_nodes: 2

  - is_true:   cluster_name
  - is_false:  timed_out
  - gte:       { number_of_nodes:         2 }
  - gte:       { number_of_data_nodes:    2 }
