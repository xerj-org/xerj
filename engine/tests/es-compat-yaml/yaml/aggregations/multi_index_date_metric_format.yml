---
setup:
  - do:
      indices.create:
        index: date-metric-a
        body:
          mappings:
            properties:
              n: { type: date }
  - do:
      indices.create:
        index: date-metric-b
        body:
          mappings:
            properties:
              n: { type: date }
  - do:
      index:
        index: date-metric-a
        id: "1"
        body: { n: "2020-01-01T00:00:00Z" }
  - do:
      index:
        index: date-metric-b
        id: "1"
        body: { n: "2024-01-01T00:00:00Z" }
  - do:
      indices.refresh:
        index: date-metric-a,date-metric-b
---
"multi-index min formatted value follows minimum timestamp":
  - do:
      search:
        index: date-metric-a,date-metric-b
        body:
          size: 0
          aggs:
            earliest: { min: { field: n } }
  - match: { aggregations.earliest.value: 1577836800000.0 }
  - match: { aggregations.earliest.value_as_string: "2020-01-01T00:00:00.000Z" }
---
"multi-index reversed max formatted value follows maximum timestamp":
  - do:
      search:
        index: date-metric-b,date-metric-a
        body:
          size: 0
          aggs:
            latest: { max: { field: n } }
  - match: { aggregations.latest.value: 1704067200000.0 }
  - match: { aggregations.latest.value_as_string: "2024-01-01T00:00:00.000Z" }
