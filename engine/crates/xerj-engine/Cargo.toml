[package]
name = "xerj-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Integration crate that wires together all xerj subsystems"

[dependencies]
xerj-common  = { path = "../xerj-common" }
xerj-storage = { path = "../xerj-storage" }
xerj-fts     = { path = "../xerj-fts" }
xerj-vector  = { path = "../xerj-vector" }
xerj-logs    = { path = "../xerj-logs" }
xerj-query   = { path = "../xerj-query" }
xerj-compress = { path = "../xerj-compress" }
xerj-ai      = { path = "../xerj-ai" }
xerj-wasm    = { path = "../xerj-wasm" }
xerj-cluster = { path = "../xerj-cluster" }

tokio      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
simd-json  = { workspace = true }
memchr     = { workspace = true }
tracing    = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
dashmap    = { workspace = true }
arc-swap   = { workspace = true }
parking_lot = "0.12"
# WAL tap (#320): the outbound `_bulk` sender. Already in the tree via
# xerj-ai, so this adds no new external dependency.
reqwest    = { workspace = true }
rayon      = { workspace = true }
libc       = "0.2"
uuid       = { workspace = true }
sha2       = "0.10"   # v0.9 9-P4 — audit log hash chain
chrono     = { workspace = true }
chrono-tz  = "0.8"
bytes      = { workspace = true }
regex      = "1"

# Fast non-cryptographic hash — used to shard the engine FTS memtable
# by doc_id so concurrent bulk ingest batches target different shards.
# Also seeds the `code_blocks` parsed-tree cache key (#174 follow-up).
xxhash-rust = { workspace = true }
# FxHash for the memtable hot maps (postings, field_lengths, doc-values)
# — SipHash was >21% of on-CPU time under the shard write locks at c8.
rustc-hash = { workspace = true }

# --- AST-aligned `_passage` for code hits (#174 follow-up, `code_blocks`).
# Same grammar versions as `xerj-autoindex`'s ingest-time extractor
# (`xerj-autoindex/src/extract/code.rs`) — this module re-parses at RESPONSE
# time rather than depending on that crate (autoindex depends on the engine,
# not the other way around; a reverse dependency would be circular). ---
tree-sitter = { workspace = true }
tree-sitter-python = "0.23"
tree-sitter-c = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-bash = "0.23"

[features]
default = []
# Built-in neural BERT embedder (candle). Propagates to xerj-ai. Off by
# default so the standard build stays lean and cross-compiles without the
# candle/tokenizer toolchain; enable via xerj-server's `neural` feature.
neural = ["xerj-ai/neural"]
onnx-experimental = ["xerj-ai/onnx-experimental"]
stackprobe = []

[dev-dependencies]
xerj-storage = { path = "../xerj-storage", features = ["test-hooks"] }
# `raw-api` exposes `DashMap::shards()`, which is the only way to assert what
# #873 fixed: that a per-index cache's shard array is capped rather than sized
# from the host core count. Dev-only: with resolver = "2" it never reaches the
# release binary's graph.
dashmap   = { workspace = true, features = ["raw-api"] }
tempfile  = { workspace = true }
# `test-util` is what lets a test pause tokio's clock (`start_paused = true`)
# and step a background timer deterministically instead of sleeping through it.
# Dev-only: with resolver = "2" it never reaches the release binary's graph.
tokio     = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
criterion = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "search_bench"
harness = false
