[package]
name = "xerj-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Built-in Candle neural embedder, for the `binary_bulk_throughput`
# example (#903) and for anyone linking this crate directly. The shipped
# binary turns it on through `xerj-server`'s own `neural` feature.
neural = ["xerj-engine/neural"]
# Local zero-shot decision head (issue #1057): tier 2 of the System One
# decide ladder, answering /v1/systemone and /_decide when the history
# index has no support. Mirrors how `neural` is gated — enabled by whoever
# links this crate; since rc.80 the shipped binary turns it on through
# `xerj-server`'s default feature set (runtime stays opt-in via
# `--decide-mode local`). Also arms the `judge` stage's model arm (issue
# #1060): the same loader, the same model directory, the same loaded copy.
decide-local = ["dep:xerj-ai", "xerj-ai/decide-local", "xerj-rerank/judge-local"]
onnx-experimental = ["xerj-engine/onnx-experimental"]

[dependencies]
xerj-common  = { path = "../xerj-common" }
xerj-engine  = { path = "../xerj-engine" }
xerj-query   = { path = "../xerj-query" }
xerj-rerank = { path = "../xerj-rerank" }
# Corpus Hub hosted endpoints (`hub_api.rs`): `def::lookup_in` is the one `def`
# function every surface calls, and `xerj_autoindex::xc::code_root` is where its
# state ledger lives. `xerj-hub` dev-depends on this crate (its pack roundtrip
# test boots a node); Cargo accepts a cycle that runs through a dev-dependency.
xerj-hub     = { path = "../xerj-hub" }
xerj-autoindex = { path = "../xerj-autoindex" }
xerj-wasm    = { path = "../xerj-wasm" }
# Local decision head (feature `decide-local`); no other purpose, so the
# dependency itself is optional.
xerj-ai      = { path = "../xerj-ai", optional = true }
# Note: this crate intentionally does NOT depend on xerj-console-api.
# Xerj Console is a peer product mounted at the server level (`xerj-server`)
# via Router::merge. Engine API and Xerj Console API are decoupled — the
# engine doesn't know Xerj Console exists, and Xerj Console could be removed from
# the binary build without changing a line of xerj-api code.

tokio        = { workspace = true }
axum         = { workspace = true }
tower        = { workspace = true, features = ["util"] }
tower-http   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
uuid         = { workspace = true }
chrono       = { workspace = true }
bytes        = { workspace = true }
prometheus   = { workspace = true }
dashmap              = { workspace = true }
tracing-subscriber   = { workspace = true }
# Second-brain graph API: edge_id identity hashing (SECOND_BRAIN_SPEC §2.3).
xxhash-rust          = { workspace = true }

async-trait  = "0.1"
libc         = "0.2"
# Share links (`/_share`): the passcode a guest types is short and human-typed,
# so unlike a minted API-key secret it needs a real password hash.
argon2       = "0.5"
# Share ids / passcodes are minted from the OS CSPRNG.
rand         = { workspace = true }
# Share ids are stored as a SHA-256 digest, never in the clear.
sha2         = "0.10"

[dev-dependencies]
tempfile     = { workspace = true }
tower        = { workspace = true, features = ["util"] }
http-body-util = "0.1"
