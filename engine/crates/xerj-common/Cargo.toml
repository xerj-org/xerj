[package]
name = "xerj-common"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared types, configuration, and error handling for the xerj search engine"

[dependencies]
serde.workspace = true
# `preserve_order` (declared here because it must live under crates/**;
# cargo feature-unification makes it workspace-wide): `_source` must
# round-trip with the caller's original key order — ES returns the indexed
# source bytes verbatim, and alphabetized keys were a live-verified wire
# divergence (2026-07-10 scorecard, B2).
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
bytes.workspace = true
byteorder.workspace = true
prometheus.workspace = true
# Machine probes for `resource`: sysconf/sysctl/setpriority. No abstraction
# layer buys anything here — the calls differ per platform by design.
libc = "0.2"
# `localauth`: real URL parsing for the loopback guard. Already in the graph
# via reqwest (which re-exports this exact type as `reqwest::Url`), so this
# adds an edge, not a second URL parser. Hand-rolled host surgery is how the
# `http://localhost:9200@evil.com/` userinfo leak happened — see
# src/localauth.rs.
url = "2"
sha2 = "0.10"
serde_json_canonicalizer = "0.3.2"
# `normalizer`: the keyword `asciifolding` normalizer strips the combining
# marks of the canonical decomposition. Already in the graph via xerj-fts.
unicode-normalization = "0.1"
# `hub_client_cache` reads a signed `<slug>-<pin8>.hubpack.tar.zst` in memory
# and checks its detached ed25519 signature. The same crates, at the same
# versions, as `xerj-hub` (pack.rs) and `xerj-autoindex` (harvest/sign.rs)
# already use, so this adds edges and no new package.
zstd.workspace = true
ring.workspace = true
tar = "0.4"

[dev-dependencies]
tempfile.workspace = true
