[package]
name = "xerj-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Model Context Protocol (MCP) stdio server exposing the canonical XERJ agent operations (search, memory, second-brain graph, field map, reference-code) as thin proxies to an ES-compatible XERJ endpoint, plus the Corpus Hub ask/def/find tools"

# Library first: the `xerj mcp` subcommand on the main binary calls
# `xerj_mcp::run`, so a user with the installed `xerj` binary already has the
# MCP server. The standalone binary below is a thin wrapper over the same entry
# point (CI builds and smoke-tests it).
[lib]
name = "xerj_mcp"
path = "src/lib.rs"

[[bin]]
name = "xerj-mcp"
path = "src/main.rs"

[dependencies]
# Async runtime (needs `io-std` for stdin/stdout, `rt-multi-thread`, `macros`).
tokio = { workspace = true }
# HTTP client used to proxy every tool call to the running XERJ engine.
# Inherits the workspace's default-features=false + rustls-tls config, so it
# builds in the same offline/cross-compile matrix as the rest of the tree.
reqwest = { workspace = true }
# All request/response bodies are handled as untyped JSON `Value`s — no
# bespoke serde structs, which keeps the wire contract identical to what the
# engine already accepts.
serde_json = { workspace = true }
anyhow = { workspace = true }
# The feedback invitation, shared with every other --help surface so the five
# cannot drift apart.
xerj-common = { path = "../xerj-common" }
# The `rerank` argument's limits and its validator. Depending on the crate the
# node itself validates with means the tool description quotes the real
# ceilings and the builder refuses exactly what the node would refuse — the
# two cannot drift. A light leaf: it adds no dependency this crate lacks.
xerj-rerank = { path = "../xerj-rerank" }
# The `max_tokens` budget (#1058) counts with XERJ's StandardTokenizer —
# UAX #29 word boundaries via `unicode_words()`. Depended on directly (the
# same crate and the same call xerj-fts's StandardTokenizer makes,
# engine/crates/xerj-fts/src/analyzer.rs) rather than pulling the whole FTS
# stack into this thin proxy; the count is identical by construction.
# See src/token_budget.rs.
unicode-segmentation = "1"
# Corpus Hub v2 (plan §7): the `xerj_hub_*` tools run the `xerj ask` flow
# itself (`xerj_hub::ask`), the one implementation the CLI and the gRPC
# service share — the tools are adapters, not a second copy of the flow.
xerj-hub = { path = "../xerj-hub" }

[dev-dependencies]
# The loopback admin-key fallback tests sandbox cwd + HOME so discovery sees
# only the key files the test wrote (same pattern as xerj-autoindex's cli
# tests, where the helper was born).
tempfile = { workspace = true }
# The hub tools' end-to-end test answers from a real in-process node holding a
# restored fixture corpus (the keystone's mini-c), as `xerj-hub`'s own tests do.
xerj-api = { path = "../xerj-api" }
xerj-engine = { path = "../xerj-engine" }
axum.workspace = true
